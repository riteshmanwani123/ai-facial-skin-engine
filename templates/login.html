<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | CLARITY</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/portal.css">
</head>
<body>
    <header class="app-header">
        <div class="header-container">
            <div class="brand">
                <img src="/static/images/clarity_logo.jpg" alt="CLARITY" class="brand-logo-img">
                <div class="brand-text">
                    <span class="brand-name">CLARITY <span class="highlight">by Dr. Tanya</span></span>
                    <span class="brand-tag">SIGN IN</span>
                </div>
            </div>
            <div class="header-actions">
                <a class="btn btn-secondary btn-small" href="/"><i class="fa-solid fa-hospital"></i> Clinic dashboard</a>
            </div>
        </div>
    </header>

    <main class="portal-main auth-main">
        <section class="card auth-card">
            <div class="card-header">
                <h2><i class="fa-solid fa-right-to-bracket"></i> Sign in</h2>
                <p id="auth-context-note">Enter your email and password to continue.</p>
            </div>
            <form id="login-form" class="auth-form">
                <label>Email<input type="email" name="email" required autocomplete="email"></label>
                <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
                <div id="login-error" class="form-error"></div>
                <button type="submit" class="btn btn-primary full"><i class="fa-solid fa-right-to-bracket"></i> Sign in</button>
            </form>
            <p class="auth-switch">Don't have an account? <a href="/signup">Create one</a></p>
        </section>
    </main>

    <script src="/static/js/login.js"></script>
</body>
</html>
